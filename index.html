<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XDS</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* Subtle background glow */
.background-glow {
    position: fixed;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.035);
    filter: blur(100px);
    pointer-events: none;
}

/* Main */
.wrapper {
    width: 92%;
    max-width: 600px;
    text-align: center;
    position: relative;
    z-index: 2;
}

.title {
    font-size: clamp(36px, 8vw, 65px);
    font-weight: 800;
    letter-spacing: -2px;
    line-height: 1.1;
}

.title span {
    color: #777;
}

.subtitle {
    margin-top: 14px;
    font-size: 12px;
    color: #555;
    letter-spacing: 4px;
    text-transform: uppercase;
}

/* Divider */
.divider {
    width: 45px;
    height: 1px;
    background: #333;
    margin: 28px auto;
}

/* Button */
.button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 330px;
    height: 54px;

    border: 1px solid #292929;
    border-radius: 10px;

    background: #0b0b0b;
    color: #fff;

    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;

    cursor: pointer;
    text-decoration: none;

    transition:
        background .2s ease,
        border-color .2s ease,
        transform .2s ease,
        box-shadow .2s ease;
}

.button:hover {
    background: #151515;
    border-color: #555;
    transform: translateY(-2px);
    box-shadow: 0 10px 35px rgba(255,255,255,.06);
}

.button:active {
    transform: translateY(0) scale(.98);
}

.footer {
    margin-top: 25px;
    color: #333;
    font-size: 10px;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="background-glow"></div>

<div class="wrapper">

    <div class="title">
        XDS <span>LEAKED SOURCE</span>
    </div>

    <div class="subtitle">
        BY AMIR
    </div>

    <div class="divider"></div>

    <a
        class="button"
        href="https://yip.su/2tbyv8"
        target="_blank"
        rel="noopener noreferrer"
    >
        XDS — ALL SOURCE
    </a>

    <div class="footer">
        XDS © 2026
    </div>

</div>

</body>
</html>
